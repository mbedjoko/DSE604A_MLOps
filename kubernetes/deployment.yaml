apiVersion: apps/v1
kind: Deployment
metadata:
  name: telco-churn-model
  labels:
    app: telco-churn-model
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telco-churn-model
  template:
    metadata:
      labels:
        app: telco-churn-model
    spec:
      containers:
      - name: telco-churn-model
        image: dse604a-telco-serve:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
